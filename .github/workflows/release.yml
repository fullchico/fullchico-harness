name: release
# Uma tag vX.Y.Z publica essa versão no npm, depois de a suíte passar e de a tag bater com
# a versão escrita no pacote e no plugin. Não há token: o npm confia neste workflow deste
# repositório (publicação confiável, por OIDC), configurada uma vez com `npm trust github`.
on:
  push:
    tags: ["v*"]
jobs:
  publish:
    runs-on: macos-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: A tag bate com a versão
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag $TAG, pacote $PKG: precisam ser iguais"; exit 1; }
      - run: npm ci
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: python3 -W error -m unittest discover -s tests
      # A publicação confiável exige npm 11.5 ou mais novo.
      - run: npm install -g npm@latest
      # Pré-lançamento (vX.Y.Z-rc.N) vai para a tag `next`: `npx @fullchico/harness@latest` continua na estável.
      - run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then npm publish --tag next; else npm publish; fi
      - run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then PRE=--prerelease; else PRE=; fi
          gh release create "$GITHUB_REF_NAME" --generate-notes $PRE
        env:
          GH_TOKEN: ${{ github.token }}
