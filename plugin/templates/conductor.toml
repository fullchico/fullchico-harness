# Gerado pelo harness. Não edite: muda por .harness/update.
"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"
file_include_globs = ".env*"

[scripts]
setup = ".harness/setup-worktree"
archive = ".harness/destroy || true"

[scripts.run.dev]
command = ".harness/up && .harness/prepare && .harness/dev"
default = true
icon = "play"

[scripts.run.stop]
command = ".harness/down"
icon = "square"
