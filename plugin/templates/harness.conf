# Configuração do projeto para o harness. Só o dono edita.
# Formato: CHAVE=valor, uma por linha. Descomente o que o projeto usa.

# Nome usado no projeto Docker de cada worktree.
# PROJECT=meuapp

# Serviços que precisam de porta. A ordem define o deslocamento dentro do bloco.
# SERVICES="web api postgres redis"
# COMPOSE_FILE=docker-compose.dev.yml

# Comando de instalação de dependências, rodado ao criar um worktree.
# INSTALL_CMD="pnpm install"

# Depois de a infra ficar saudável (migration, seed) e o processo do app.
# AFTER_UP="pnpm db:migrate"
# DEV_CMD="pnpm dev"

# Checagens do projeto: no push, e antes de abrir o PR.
# VALIDATE_PUSH="pnpm test"
# VALIDATE_MERGE="pnpm test && pnpm build"

# Arquitetura. Os caminhos do contrato entre front e back (e do que é comum): só o ticket de
# contrato os possui, e todos os outros esperam por ele. E o comando que confere as fronteiras
# (direção das dependências, entrada pública dos módulos), com a ferramenta da linguagem.
# CONTRACT_PATHS="packages/contracts apps/web/src/shared"
# VALIDATE_ARCH="pnpm exec depcruise apps/api/src && pnpm exec steiger apps/web/src"

# Branch padrão, quando não for main nem master e o remoto não a anunciar.
# DEFAULT_BRANCH=trunk

# Máximo de implementadores em paralelo numa entrega.
# MAX_PARALLEL=3

# Mapa do código: profundidade das unidades e pastas que ficam de fora.
# MAP_DEPTH=2
# MAP_EXCLUDE="docs .harness .claude .github"

# Quantos commits na área de um ADR pedem que ele seja relido.
# ADR_REVIEW_COMMITS=20

# Gerar também a integração com o Conductor (.conductor/settings.toml).
# CONDUCTOR=1

# Variáveis derivadas das portas, gravadas no .env do worktree.
# ENV_DATABASE_URL='postgresql://app:app@localhost:${POSTGRES_PORT}/app'
