# Configuração do projeto para o harness. Muda por .harness/conf-apply ou pelo dono.
# Formato: CHAVE=valor, uma por linha. Descomente o que o projeto usa.

# Perfil do projeto. Decide quanto de arquitetura e de stack o harness traz:
#   fullstack-typescript  a stack padrão (NestJS, Next.js, Drizzle, Zod) com as skills dela. É o padrão.
#   livre                 projeto novo em outra stack: valem os conceitos de arquitetura; a stack é da spec.
#   existente             projeto que já tinha código: vale a organização e a língua que ele já usa.
# Mudar o perfil pede uma nova sincronização (.harness/update).
# PROFILE=fullstack-typescript

# Nome usado no projeto Docker de cada worktree.
# PROJECT=meuapp

# Serviços que precisam de porta. A ordem define o deslocamento dentro do bloco.
# SERVICES="web api postgres redis"
# COMPOSE_FILE=docker-compose.dev.yml

# Comando de instalação de dependências, rodado ao criar um worktree.
# INSTALL_CMD="pnpm install --frozen-lockfile"

# Depois de a infra ficar saudável (migration, seed) e o processo do app.
# AFTER_UP="pnpm db:migrate"
# DEV_CMD="pnpm dev"

# Checagens do projeto: ao fechar e ao integrar cada ticket e no push feito à mão; e antes de abrir o PR.
# VALIDATE_PUSH="pnpm test"
# VALIDATE_MERGE="pnpm test && pnpm build"

# Arquitetura. Os caminhos do que é comum (o contrato entre front e back, a camada shared do
# front): só o ticket de contrato os possui, e todos os outros esperam por ele. E o comando que confere as fronteiras
# (direção das dependências, entrada pública dos módulos), com a ferramenta da linguagem.
# CONTRACT_PATHS="packages/contracts apps/web/src/shared"
# VALIDATE_ARCH="pnpm exec depcruise apps/api/src && pnpm exec steiger apps/web/src"

# Branch padrão, quando não for main nem master e o remoto não a anunciar.
# DEFAULT_BRANCH=trunk

# Máximo de implementadores em paralelo numa entrega.
# MAX_PARALLEL=3

# Mapa do código: profundidade das unidades e pastas que ficam de fora.
# MAP_DEPTH=2
# MAP_EXCLUDE="docs .harness .claude .github"

# Quantos commits na área de um ADR pedem que ele seja relido.
# ADR_REVIEW_COMMITS=20

# Gerar também a integração com o Conductor (.conductor/settings.toml).
# CONDUCTOR=1

# Navegador dos testes de ponta a ponta: um serviço `playwright` no compose (a imagem oficial,
# rodando `playwright run-server`, com `shm_size` e não `ipc: host`), listado em SERVICES, e o
# endereço dele para os testes. A suíte entra só no VALIDATE_MERGE.
# ENV_PW_TEST_CONNECT_WS_ENDPOINT='ws://localhost:${PLAYWRIGHT_PORT}/'

# Variáveis derivadas das portas, gravadas no .env do worktree.
# ENV_DATABASE_URL='postgresql://app:app@localhost:${POSTGRES_PORT}/app'
