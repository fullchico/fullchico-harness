<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-labelledby="t d">
  <title id="t">O loop da memória</title>
  <desc id="d">Um trilho circular com três estações: configurar cria o mapa do código, planejar confere o mapa antes da entrevista, entregar dispara o sonho que lê as sessões. No centro, o caderno de notas conferidas com o código abastece a próxima sessão.</desc>
  <defs>
    <style>
      .ink { fill: none; stroke: #1d1b16; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #1d1b16; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .paper { fill: #ffffff; stroke: #1d1b16; stroke-width: 6; stroke-linejoin: round; }
      .solid { fill: #1d1b16; }
      .dash { fill: none; stroke: #1d1b16; stroke-width: 4; stroke-dasharray: 4 12; stroke-linecap: round; }
      .label { font: 800 26px "Helvetica Neue", Arial, sans-serif; fill: #1d1b16; }
      .small { font: 700 20px "Helvetica Neue", Arial, sans-serif; fill: #1d1b16; }
    </style>
  </defs>

  <!-- o trilho em volta -->
  <ellipse class="ink" cx="600" cy="320" rx="400" ry="190"/>
  <ellipse class="thin" cx="600" cy="320" rx="372" ry="164"/>
  <g class="thin">
    <path d="M600 130 v26"/><path d="M600 484 v26"/><path d="M200 320 h28"/><path d="M972 320 h28"/>
    <path d="M440 146 l6 24"/><path d="M760 146 l-6 24"/><path d="M440 494 l6 -24"/><path d="M760 494 l-6 -24"/>
  </g>

  <!-- estação 1: configurar cria o mapa -->
  <g transform="translate(300 175)">
    <path class="paper" d="M-66 -46 l44 -14 l44 14 l44 -14 v96 l-44 14 l-44 -14 l-44 14 Z"/>
    <path class="thin" d="M-22 -60 v96 M22 -46 v96"/>
    <path class="thin" d="M-52 -6 q18 -22 36 0 t36 0 t34 -6"/>
  </g>
  <text class="label" x="300" y="80" text-anchor="middle">configurar</text>
  <text class="small" x="330" y="270" text-anchor="middle">cria o mapa</text>

  <!-- estação 2: planejar confere o mapa -->
  <g transform="translate(900 175)">
    <path class="paper" d="M-46 -56 h92 v112 h-92 Z"/>
    <path class="paper" d="M-20 -68 h40 v22 h-40 Z"/>
    <path class="thin" d="M-28 -20 h56 M-28 6 h56 M-28 32 h30"/>
    <circle class="paper" cx="44" cy="40" r="24"/>
    <path class="ink" d="M61 57 l22 22"/>
  </g>
  <text class="label" x="900" y="80" text-anchor="middle">planejar</text>
  <text class="small" x="870" y="270" text-anchor="middle">confere o mapa</text>

  <!-- estação 3: entregar dispara o sonho -->
  <g transform="translate(600 520)">
    <path class="paper" d="M-74 24 q-28 -46 22 -60 q8 -40 62 -28 q48 -30 70 22 q48 6 28 66 Z"/>
    <path class="solid" d="M-30 -14 a24 24 0 1 0 24 32 a20 20 0 1 1 -24 -32 Z"/>
    <text class="small" x="20" y="8">z</text><text class="label" x="38" y="-8">z</text>
  </g>
  <text class="label" x="600" y="612" text-anchor="middle">entregar → sonhar</text>

  <!-- no centro: o caderno de notas -->
  <g transform="translate(600 270)">
    <path class="paper" d="M-110 -76 h102 q8 0 8 10 q0 -10 8 -10 h102 v150 h-102 q-8 0 -8 10 q0 -10 -8 -10 h-102 Z"/>
    <path class="thin" d="M0 -66 v140"/>
    <path class="thin" d="M-90 -42 h68 M-90 -14 h68 M-90 14 h52 M-90 42 h68"/>
    <path class="thin" d="M22 -42 h68 M22 -14 h50 M22 14 h68"/>
    <path class="ink" d="M30 40 l12 14 l24 -28"/>
  </g>
  <text class="small" x="600" y="382" text-anchor="middle">notas conferidas no código</text>
  <text class="small" x="600" y="406" text-anchor="middle">abrem a próxima sessão</text>

  <!-- brilhos -->
  <path class="solid" d="M430 170 q4 22 20 26 q-16 4 -20 26 q-4 -22 -20 -26 q16 -4 20 -26 Z"/>
  <path class="solid" d="M770 170 q3 16 15 19 q-12 3 -15 19 q-3 -16 -15 -19 q12 -3 15 -19 Z"/>
  <path class="solid" d="M90 470 q3 16 15 19 q-12 3 -15 19 q-3 -16 -15 -19 q12 -3 15 -19 Z"/>
  <path class="solid" d="M1110 470 q3 16 15 19 q-12 3 -15 19 q-3 -16 -15 -19 q12 -3 15 -19 Z"/>
</svg>
