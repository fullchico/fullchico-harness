<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 520" role="img" aria-label="Quem faz o quê: Você pede e responde, o Desenho entrevista e escreve a spec, o Orquestrador fatia e conduz, e três Implementadores trabalham em paralelo, cada um no seu trilho. Do outro lado de uma cancela ficam os Revisores, que aprovam ou recusam: quem escreve não aprova.">
<style>.ink{stroke:#1d1b16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke-width:3}.paper{fill:#fff}.ok{fill:#2fae74}.warn{fill:#f5b73b}.no{fill:#e5604d}.dot{fill:#1d1b16;stroke:none}.ties{stroke-width:12;stroke-linecap:butt;stroke-dasharray:4 20}.txt{fill:#1d1b16;stroke:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;font-size:20px;text-anchor:middle}.sub{font-weight:400}.big{font-size:26px}@media (prefers-color-scheme:dark){.ink{stroke:#f1efe9}.paper{fill:#191919}.txt,.dot{fill:#f1efe9}}</style>
