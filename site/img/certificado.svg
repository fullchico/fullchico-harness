<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-labelledby="t d">
  <title id="t">O certificado no documento da demanda</title>
  <desc id="d">A spec da demanda tem o critério no alto e, no apêndice, três selos: o aceite do dono e os vereditos dos revisores. Cada selo desce por uma linha tracejada até um commit no trilho do Git, assinado por quem validou.</desc>
  <defs>
    <style>
      .ink { fill: none; stroke: #1d1b16; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke: #1d1b16; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .paper { fill: #ffffff; stroke: #1d1b16; stroke-width: 6; stroke-linejoin: round; }
      .solid { fill: #1d1b16; }
      .dash { fill: none; stroke: #1d1b16; stroke-width: 4; stroke-dasharray: 4 12; stroke-linecap: round; }
      .label { font: 800 26px "Helvetica Neue", Arial, sans-serif; fill: #1d1b16; }
      .small { font: 700 20px "Helvetica Neue", Arial, sans-serif; fill: #1d1b16; }
      .mono { font: 700 18px Menlo, Consolas, monospace; fill: #1d1b16; }
    </style>
  </defs>

  <!-- trilho do Git -->
  <path class="ink" d="M40 540 H1160"/>
  <path class="thin" d="M40 556 H1160"/>
  <g class="thin">
    <path d="M80 532 v32"/><path d="M160 532 v32"/><path d="M240 532 v32"/><path d="M320 532 v32"/>
    <path d="M400 532 v32"/><path d="M480 532 v32"/><path d="M560 532 v32"/><path d="M640 532 v32"/>
    <path d="M720 532 v32"/><path d="M800 532 v32"/><path d="M880 532 v32"/><path d="M960 532 v32"/>
    <path d="M1040 532 v32"/><path d="M1120 532 v32"/>
  </g>
  <text class="small" x="44" y="590">git</text>

  <!-- o documento -->
  <path class="paper" d="M330 40 H760 L830 110 V500 H330 Z"/>
  <path class="ink" d="M760 40 V110 H830"/>
  <text class="label" x="370" y="98">spec da demanda</text>
  <g class="thin">
    <path d="M370 140 H770"/><path d="M370 172 H740"/><path d="M370 204 H780"/><path d="M370 236 H700"/>
  </g>
  <text class="small" x="370" y="276">critério aceito</text>
  <path class="dash" d="M350 300 H810"/>
  <text class="mono" x="370" y="332">## Certificates</text>

  <!-- selo do dono -->
  <g transform="translate(430 400)">
    <circle class="paper" r="46"/>
    <circle class="thin" r="34"/>
    <path class="ink" d="M-16 2 l10 12 l22 -26"/>
  </g>
    <!-- selo quality -->
  <g transform="translate(580 400)">
    <path class="paper" d="M0 -48 l12 10 l16 -4 l4 16 l14 8 l-6 15 l8 14 l-14 9 l-1 17 l-16 -2 l-11 12 l-11 -12 l-16 2 l-1 -17 l-14 -9 l8 -14 l-6 -15 l14 -8 l4 -16 l16 4 Z"/>
    <path class="ink" d="M-14 2 l9 11 l20 -24"/>
  </g>
  <!-- selo bugs -->
  <g transform="translate(730 400)">
    <path class="paper" d="M0 -48 l12 10 l16 -4 l4 16 l14 8 l-6 15 l8 14 l-14 9 l-1 17 l-16 -2 l-11 12 l-11 -12 l-16 2 l-1 -17 l-14 -9 l8 -14 l-6 -15 l14 -8 l4 -16 l16 4 Z"/>
    <path class="ink" d="M-14 2 l9 11 l20 -24"/>
  </g>
  <text class="small" x="430" y="476" text-anchor="middle">dono</text>
  <text class="small" x="580" y="476" text-anchor="middle">quality</text>
  <text class="small" x="730" y="476" text-anchor="middle">bugs</text>

  <!-- cada selo desce até o commit de quem assinou -->
  <path class="dash" d="M430 508 V522"/>
  <path class="dash" d="M580 508 V522"/>
  <path class="dash" d="M730 508 V522"/>
  <circle class="paper" cx="430" cy="540" r="14"/>
  <circle class="paper" cx="580" cy="540" r="14"/>
  <circle class="paper" cx="730" cy="540" r="14"/>
  <circle class="solid" cx="200" cy="540" r="10"/>
  <circle class="solid" cx="300" cy="540" r="10"/>
  <circle class="solid" cx="880" cy="540" r="10"/>

  <!-- o dono, à esquerda, aceitando -->
  <g transform="translate(150 300)">
    <path class="paper" d="M-44 0 q44 -22 88 0 l8 96 h-104 Z"/>
    <circle class="paper" cx="0" cy="-58" r="54"/>
    <ellipse class="solid" cx="-18" cy="-66" rx="8" ry="12"/>
    <ellipse class="solid" cx="18" cy="-66" rx="8" ry="12"/>
    <circle cx="-15" cy="-71" r="3" fill="#fff"/><circle cx="21" cy="-71" r="3" fill="#fff"/>
    <path class="ink" d="M-24 -38 q24 26 48 0"/>
    <g class="solid"><circle cx="-34" cy="-44" r="2.5"/><circle cx="-28" cy="-40" r="2.5"/><circle cx="34" cy="-44" r="2.5"/><circle cx="28" cy="-40" r="2.5"/></g>
    <path class="ink" d="M40 22 q56 -6 104 64"/>
    <circle class="paper" cx="150" cy="92" r="16"/>
    <path class="ink" d="M-26 96 v26 M26 96 v26"/>
    <path class="paper" d="M-58 122 q0 -14 30 -14 h8 v24 h-38 Z"/>
    <path class="paper" d="M20 108 h8 q30 0 30 14 v10 h-38 Z"/>
  </g>
  <text class="small" x="150" y="470" text-anchor="middle">o dono aceita</text>
  <text class="small" x="150" y="496" text-anchor="middle">o critério</text>

  <!-- o fiscal, à direita, carimbando -->
  <g transform="translate(1010 296)">
    <path class="paper" d="M-44 0 q44 -22 88 0 l8 96 h-104 Z"/>
    <circle class="paper" cx="0" cy="-58" r="52"/>
    <path class="paper" d="M-54 -84 q54 -52 108 0 Z"/>
    <path class="paper" d="M-66 -84 h132 q-4 14 -66 14 q-62 0 -66 -14 Z"/>
    <circle class="paper" cx="0" cy="-112" r="10"/>
    <ellipse class="solid" cx="-17" cy="-52" rx="7" ry="11"/>
    <ellipse class="solid" cx="17" cy="-52" rx="7" ry="11"/>
    <circle cx="-14" cy="-57" r="3" fill="#fff"/><circle cx="20" cy="-57" r="3" fill="#fff"/>
    <path class="ink" d="M-20 -28 q20 20 40 0"/>
    <path class="solid" d="M0 4 l-20 -11 v22 Z M0 4 l20 -11 v22 Z"/>
    <circle class="solid" cx="0" cy="34" r="4"/><circle class="solid" cx="0" cy="58" r="4"/>
    <path class="ink" d="M-42 22 q-64 6 -110 68"/>
    <path class="paper" d="M-182 94 h56 v24 h-56 Z"/>
    <path class="ink" d="M-154 70 v24"/>
    <circle class="paper" cx="-154" cy="64" r="12"/>
    <path class="ink" d="M-26 96 v26 M26 96 v26"/>
    <path class="paper" d="M-58 122 q0 -14 30 -14 h8 v24 h-38 Z"/>
    <path class="paper" d="M20 108 h8 q30 0 30 14 v10 h-38 Z"/>
  </g>
  <text class="small" x="1010" y="470" text-anchor="middle">o revisor assina</text>
  <text class="small" x="1010" y="496" text-anchor="middle">com o próprio commit</text>

  <!-- brilhos -->
  <path class="solid" d="M890 56 q4 22 20 26 q-16 4 -20 26 q-4 -22 -20 -26 q16 -4 20 -26 Z"/>
  <path class="solid" d="M262 108 q3 16 15 19 q-12 3 -15 19 q-3 -16 -15 -19 q12 -3 15 -19 Z"/>
  <path class="solid" d="M1120 136 q3 16 15 19 q-12 3 -15 19 q-3 -16 -15 -19 q12 -3 15 -19 Z"/>
  <path class="solid" d="M80 120 q3 14 13 17 q-10 3 -13 17 q-3 -14 -13 -17 q10 -3 13 -17 Z"/>
</svg>
