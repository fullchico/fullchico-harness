  <g class="ink"><path d="M632 137q31-32 64 0z" class="green"/><rect x="627" y="137" width="75" height="8" rx="4" class="green"/><path d="M895 105h64l-10 16 10 16h-64z" class="amber"/><rect x="350" y="113" width="55" height="62" rx="8" class="amber"/><rect x="405" y="123" width="55" height="52" rx="8" class="green"/><circle cx="389" cy="197" r="8"/><circle cx="438" cy="197" r="8"/></g>
  <g class="face"><circle cx="653" cy="157" r="1.7"/><circle cx="675" cy="157" r="1.7"/><path d="M655 168q10 8 20 0"/><circle cx="913" cy="157" r="1.7"/><circle cx="935" cy="157" r="1.7"/><path d="M915 168q10 8 20 0"/><path d="M138 164q7 6 14 0"/></g>
  <text x="66" y="54" font-weight="700">Entrada</text><text x="337" y="54" font-weight="700">Percurso</text><text x="593" y="54" font-weight="700">Fiscal</text><text x="856" y="54" font-weight="700">Destino</text>
  <text x="133" y="157">?</text><text x="696" y="183">✓</text><text x="951" y="185">✓</text>
