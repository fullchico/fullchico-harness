<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 340" role="img" aria-labelledby="title desc">
  <title id="title">Passaporte da entrega</title>
  <desc id="desc">A tarefa recebe requisitos no começo, trabalha no meio e passa por validações independentes no fim. Se falta um carimbo, volta para correção.</desc>
  <style>text{font:19px system-ui,sans-serif;fill:#1d1b16}.small{font-size:16px}.ink{fill:#fff;stroke:#1d1b16;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.line{fill:none;stroke:#1d1b16;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.green{fill:#91d8af}.amber{fill:#f5b73b}.face{fill:none;stroke:#1d1b16;stroke-width:2.6;stroke-linecap:round}</style>
  <rect width="1080" height="340" rx="18" fill="#f7f6f3"/>
  <path class="line" d="M75 158h930"/><path class="line" d="m995 149 12 9-12 9"/>
