<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 400" role="img" aria-label="O caminho de uma entrega como uma linha de trem: uma locomotiva percorre sete estações, Pedido, Entrevista, Spec e tickets, Revisão do ticket, Integração, Quatro portões e Envio. As estações Revisão do ticket, Integração e Quatro portões têm sinal verde, pois são portões.">
<style>.ink{stroke:#1d1b16;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke-width:3}.paper{fill:#fff}.ok{fill:#2fae74}.warn{fill:#f5b73b}.no{fill:#e5604d}.dot{fill:#1d1b16;stroke:none}.ties{stroke-width:12;stroke-linecap:butt;stroke-dasharray:4 20}.txt{fill:#1d1b16;stroke:none;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-weight:700;font-size:20px;text-anchor:middle}.sub{font-weight:400}.big{font-size:26px}@media (prefers-color-scheme:dark){.ink{stroke:#f1efe9}.paper{fill:#191919}.txt,.dot{fill:#f1efe9}}</style>
<defs><g id="est"><rect class="ink paper" x="-26" y="-66" width="52" height="52" rx="4"/><path class="ink paper" d="M-36-66L0-92l36 26z"/><rect class="ink thin paper" x="-8" y="-42" width="16" height="28" rx="3"/><rect class="ink paper" x="-42" y="-14" width="84" height="10" rx="5"/></g>
<g id="sinal"><path class="ink" d="M50-14v-36"/><rect class="ink paper" x="38" y="-94" width="24" height="44" rx="12"/><circle class="ink thin ok" cx="50" cy="-81" r="6"/><circle class="ink thin paper" cx="50" cy="-63" r="6"/><rect class="ink paper" x="42" y="-14" width="16" height="10" rx="4"/></g></defs>
<path class="ink ties" d="M22 288H1180"/><path class="ink" d="M20 280H1180"/>
<g transform="translate(20 145)" class="ink paper"><circle cx="150" cy="30" r="9"/><circle cx="166" cy="15" r="6.5"/><circle cx="181" cy="5" r="4.5"/><rect x="126" y="46" width="18" height="26" rx="3"/><rect x="120" y="40" width="30" height="10" rx="5"/><path d="M88 70a11 11 0 0 1 22 0z"/><rect x="62" y="68" width="106" height="42" rx="21"/><rect x="22" y="44" width="54" height="66" rx="9"/><rect x="14" y="36" width="70" height="12" rx="6"/><rect x="34" y="56" width="26" height="22" rx="5"/><path d="M166 110l26 16h-34z"/><circle cx="46" cy="116" r="17"/><circle cx="100" cy="119" r="14"/><circle cx="140" cy="119" r="14"/><path d="M100 119h40"/><circle class="warn" cx="172" cy="80" r="5.5"/></g>
<use xlink:href="#est" href="#est" x="290" y="280"/><use xlink:href="#est" href="#est" x="430" y="280"/><use xlink:href="#est" href="#est" x="570" y="280"/><use xlink:href="#est" href="#est" x="710" y="280"/><use xlink:href="#est" href="#est" x="850" y="280"/><use xlink:href="#est" href="#est" x="990" y="280"/><use xlink:href="#est" href="#est" x="1130" y="280"/>
<use xlink:href="#sinal" href="#sinal" x="710" y="280"/><use xlink:href="#sinal" href="#sinal" x="850" y="280"/><use xlink:href="#sinal" href="#sinal" x="990" y="280"/>
<text class="txt" x="290" y="334">Pedido</text>
<text class="txt" x="430" y="334">Entrevista</text>
<text class="txt" x="570" y="334">Spec e</text><text class="txt" x="570" y="359">tickets</text>
<text class="txt" x="710" y="334">Revisão</text><text class="txt" x="710" y="359">do ticket</text>
<text class="txt" x="850" y="334">Integração</text>
<text class="txt" x="990" y="334">Quatro</text><text class="txt" x="990" y="359">portões</text>
<text class="txt" x="1130" y="334">Envio</text>
<circle class="ink thin ok" cx="942" cy="62" r="9"/><text class="txt sub" x="962" y="69" style="text-anchor:start">sinal verde = portão</text>
</svg>
